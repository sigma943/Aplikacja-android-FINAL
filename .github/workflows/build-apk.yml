name: Build Android APK

on:
  push:
    branches: [main, perf/android-startup-and-rendering]
  pull_request:
    branches: [main, fix/route-rendering-242, refactor/modularize-242, fix/boguchwala-platform-242, fix/mpk-diagnostics-242, fix/mpk-mybus-fallback-242, fix/mpk-mybus-timetable-242]
  workflow_dispatch:
    inputs:
      full_verification:
        description: Run the full application, backend, browser and native regression suites
        type: boolean
        default: true


jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # Full verification stays the default. Explicitly requested quick PR builds
      # use [quick-build] in the title; local focused checks precede the build.
      FULL_VERIFICATION: ${{ !contains(github.event.pull_request.title, '[quick-build]') && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.full_verification) || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[quick-ui]'))) }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        timeout-minutes: 2
        shell: bash
        run: |
          task_java_home="${JAVA_HOME_21_X64:-}"
          if [ -z "$task_java_home" ] || [ ! -x "$task_java_home/bin/java" ]; then
            echo "::error::Java 21 is missing from the hosted runner."
            exit 1
          fi
          "$task_java_home/bin/java" -version
          echo "JAVA_HOME=$task_java_home" >> "$GITHUB_ENV"
          echo "$task_java_home/bin" >> "$GITHUB_PATH"

      - name: Restore persistent APK signing key
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/restore-apk-signing.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm ci

      - name: Verify automatic road routing fallback
        run: node --test test/journey-recovery.test.cjs test/journey-geometry.test.cjs test/route-load-retry.test.cjs test/road-route-fallback.test.cjs test/official-route-live-pattern.test.cjs test/vehicle-route-validation.test.cjs test/road-route-quality.test.cjs test/preferred-route.test.cjs test/route-cache-performance.test.cjs test/bus-routes.test.cjs test/pks-202-route.test.cjs test/pks-312-route.test.cjs test/marcel-road-routing.test.cjs

      - name: Test Application
        if: env.FULL_VERIFICATION == 'true'
        run: npm test

      - name: Verify Maintenance Backend
        if: env.FULL_VERIFICATION == 'true'
        run: |
          npm --prefix functions ci
          npm --prefix functions test

      - name: Verify journey timetable loading and history contrast
        run: |
          node --test test/map-motion.test.cjs test/physical-routing-regressions.test.cjs test/journey-opposite-stops.test.cjs test/vehicle-trip-finished.test.cjs test/official-route-live-pattern.test.cjs test/road-route-fallback.test.cjs test/journey-engine-v2.test.cjs test/journey-reliability.test.cjs test/journey-interchanges.test.cjs test/journey-marcel-integration.test.cjs test/interface-appearance.test.cjs test/stop-search.test.cjs test/journey-schedules.test.cjs test/journey-realtime.test.cjs test/journey-places.test.cjs test/journey-native-assets.test.cjs test/journey-day.test.cjs test/journey-timetable.test.cjs test/terminal-platforms-journey-label.test.cjs test/pks-terminal-physical.test.cjs test/journey-view-state.test.cjs test/journey-geometry.test.cjs test/marcel-route-assets.test.cjs test/physical-stop-aliases.test.cjs test/journey-access.test.cjs test/journey-settings.test.cjs test/personalization-profiles.test.cjs test/ban-details.test.cjs test/dialog-focus.test.cjs
          node --test test/journey-complex.test.cjs
          node test/journey-recents-browser.cjs
          node test/journey-engine-browser.cjs

      - name: Build Android Web Assets
        run: npm run build:android:web

      - name: Verify living mountain astronomy and lifecycle
        run: |
          node --test test/landscape-asset-masks.test.cjs
          node --test test/landscape-scene.test.cjs test/landscape-water-geometry.test.cjs test/landscape-gpu.test.cjs test/landscape-optics.test.cjs test/landscape.test.cjs test/app-theme.test.cjs test/interface-presets.test.cjs test/ban-image.test.cjs test/provider-delays.test.cjs test/stop-timetable.test.cjs test/appearance-backup.test.cjs test/personalization-profiles.test.cjs test/journey-places.test.cjs
          node scripts/export-landscape-scene.cjs
          node test/landscape-gpu-browser.cjs
          node test/landscape-browser.cjs

      - name: Verify removed theme migration and MPK recovery
        run: |
          node --test test/mpk-api-diagnostics.test.cjs test/mpk-mybus-fallback.test.cjs test/removed-theme.test.cjs test/mpk-mybus-departures.test.cjs test/app-theme.test.cjs test/journey-settings.test.cjs test/ban-details.test.cjs test/vehicle-stop-progress.test.cjs
          node test/theme-removal-browser.cjs

      - name: Verify journey place picker
        run: |
          JOURNEY_PICKER_ONLY=1 node test/journeys-browser.cjs
          node test/light-effects-browser.cjs
          node test/journey-live-browser.cjs
          node test/journey-disclosure-browser.cjs
          node test/font-ban-browser.cjs
          node test/stop-search-browser.cjs

      - name: Verify route stroke transition
        run: node test/route-style-browser.cjs

      - name: Verify vertical panel layout
        if: ${{ !contains(github.event.pull_request.title, '[quick-build]') }}
        run: node test/ui-horizontal-browser.cjs

      - name: Verify map stop interactions
        if: env.FULL_VERIFICATION == 'true'
        run: node test/map-stops-browser.cjs

      - name: Verify shared accent and stop views
        if: env.FULL_VERIFICATION == 'true'
        run: node test/accent-browser.cjs

      - name: Verify MPK backup route and stop pins
        if: env.FULL_VERIFICATION == 'true'
        run: node test/mpk-route-browser.cjs

      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stop-ui-previews
          path: |
            test/ui-previews/*.png
            test/ui-previews/landscape-live.webm
            test/ui-previews/landscape-high.webm
            test/ui-previews/landscape-scene.glb
            test/ui-previews/landscape-metrics.json
          if-no-files-found: ignore

      - name: Generate Android Icons
        run: npm run android:assets

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Verify Firebase restoration rules
        run: npm run test:rules

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Assemble APK
        run: |
          cd android
          chmod +x ./gradlew
          if [ "$FULL_VERIFICATION" = "true" ]; then
            ./gradlew testDebugUnitTest testReleaseUnitTest testReleaseTestUnitTest assembleDebug assembleRelease assembleReleaseTest
          else
            ./gradlew assembleDebug assembleRelease
          fi

      - name: Verify signed release matches debug application
        run: |
          python scripts/verify-apk-variants.py \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/app-release.apk \
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            "$RUNNER_TEMP/apk-variant-verification.json"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pks-live-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: pks-live-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload APK verification report
        uses: actions/upload-artifact@v4
        with:
          name: apk-variant-verification
          path: ${{ runner.temp }}/apk-variant-verification.json
          if-no-files-found: error

      - name: Verify separate signed release test
        if: env.FULL_VERIFICATION == 'true'
        run: |
          python scripts/verify-apk-variants.py --separate \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/releaseTest/app-releaseTest.apk \
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            "$RUNNER_TEMP/apk-release-test-verification.json"

      - name: Upload separate release test APK
        if: env.FULL_VERIFICATION == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pks-live-release-test-apk
          path: android/app/build/outputs/apk/releaseTest/app-releaseTest.apk
          if-no-files-found: error

      - name: Upload separate release test verification
        if: env.FULL_VERIFICATION == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-test-verification
          path: ${{ runner.temp }}/apk-release-test-verification.json
          if-no-files-found: error
