name: Local Firebase verification tools
on:
  push:
    branches: [audit/installation-ownership]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Verify existing rules against the demo emulator
        run: npm run test:rules
      - name: Package portable tools for private local verification
        run: |
          mkdir -p audit-tools/emulators
          jlink --add-modules ALL-MODULE-PATH --strip-debug --no-man-pages --no-header-files --compress=2 --output audit-tools/java
          cp "$HOME"/.cache/firebase/emulators/cloud-firestore-emulator-*.jar audit-tools/emulators/
          tar -czf audit-tools.tar.gz audit-tools
      - uses: actions/upload-artifact@v4
        with:
          name: local-firebase-verification-tools
          path: audit-tools.tar.gz
          retention-days: 3
